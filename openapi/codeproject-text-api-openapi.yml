openapi: 3.2.0
info:
  title: CodeProject.AI Server Text API
  description: CodeProject.AI Server is a self-contained, self-hosted, free and open-source AI service that exposes computer-vision, audio, NLP, and model-training capabilities through a local HTTP REST API.
  version: '2.9'
  contact:
    name: CodeProject.AI Server
    url: https://www.codeproject.com/AI/
  license:
    name: GPL-3.0
    url: https://github.com/codeproject/CodeProject.AI-Server/blob/main/LICENSE
servers:
- url: http://localhost:32168
  description: Default local CodeProject.AI Server endpoint
tags:
- name: Text
  description: Sentiment analysis and summarization.
paths:
  /v1/text/sentiment:
    post:
      operationId: analyzeSentiment
      summary: Sentiment analysis
      tags:
      - Text
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Sentiment result
  /v1/text/summarize:
    post:
      operationId: summarizeText
      summary: Summarize text
      tags:
      - Text
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                num_sentences:
                  type: integer
      responses:
        '200':
          description: Summary
components:
  securitySchemes:
    none:
      type: apiKey
      in: header
      name: X-Disabled
      description: CodeProject.AI Server runs locally and does not require authentication by default. Operators are expected to keep the service on a private network or behind their own reverse proxy.
externalDocs:
  description: CodeProject.AI Server documentation
  url: https://codeproject.github.io/codeproject.ai/
